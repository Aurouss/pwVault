<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>PwVault 界面总览</title>
  <style>
    html, body { margin: 0; width: 2000px; height: 1872px; overflow: hidden; background: #E9ECF0; }
    body { font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", sans-serif; color: #1A1E25; padding: 24px; box-sizing: border-box; }
    header { height: 56px; display: flex; align-items: baseline; gap: 14px; }
    header b { font-size: 24px; }
    header span { color: #566070; }
    .grid { display: grid; grid-template-columns: repeat(3, 640px); gap: 16px; }
    figure { margin: 0; }
    figure img { display: block; width: 640px; height: 400px; border-radius: 8px; border: 1px solid #CDD2DA; box-sizing: border-box; background: #fff; }
    figcaption { height: 30px; display: flex; align-items: center; gap: 8px; font-size: 14px; }
    figcaption i { font-style: normal; font-weight: 600; color: #0F766E; }
  </style>
</head>
<body>
  <header><b>PwVault 界面总览</b><span>界面示例图（原型），窗口基准尺寸 1280 × 800，示例数据均为虚构</span></header>
  <div class="grid" id="g"></div>
  <script src="shared.js"></script>
  <script src="pages.js"></script>
  <script>
    document.getElementById('g').innerHTML = Object.values(PAGES).map((p) =>
      `<figure><img src="../${p.file}" alt="${p.title}"><figcaption><i>${p.file.slice(0, 2)}</i>${p.title}</figcaption></figure>`).join('');
  </script>
</body>
</html>
